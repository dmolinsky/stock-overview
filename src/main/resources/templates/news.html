<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>STOCK NEWS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">

  <div class="header">
    <h1>News for <span th:text="${ticker}">AAPL</span></h1>
    <!-- SEARCHBAR TO BE IMPLEMENTED HERE LATER -->
  </div>

  <div class="section">
    <p><strong>Average sentiment:</strong>
      <span th:text="${averageScore}">0.0</span>
    </p>
  </div>

  <div class="section article-list">
    <div class="article-card" th:each="article : ${articles}">
      <h3>
        <a th:href="${article.url}" target="_blank" th:text="${article.title}">Article title</a>
      </h3>
      <p class="article-meta" th:text="${article.source} + ' • ' + ${article.publishedAt}">Source • Date</p>
      <p th:text="${article.description}">Article summary</p>

      <p class="sentiment">
        Sentiment:
        <span th:text="${article.sentimentLabel}"
              th:classappend="'sentiment-' + ${article.sentimentLabel.toLowerCase()}">Neutral</span>
        (<span th:text="${article.sentimentScore}">0.0</span>)
      </p>
    </div>
  </div>

</div>
</body>
</html>
